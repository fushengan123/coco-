name: build-ios

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build 开心视频 (dutv)
        run: bash scripts/build_ipa.sh 1.7.0 https://dutv.eu.org 开心视频 com.coco.video kaixin_v1.7.0_ios.ipa KaixinVideo 2>&1 | tee build_log.txt

      - name: Build Coco (191314)
        run: bash scripts/build_ipa.sh 1.7.0 https://191314.best Coco com.coco.video2 coco_v1.7.0_ios.ipa Coco 2>&1 | tee -a build_log.txt

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kxsp-ipa
          path: build/*.ipa
          if-no-files-found: warn

      - name: Commit build log on failure
        if: failure()
        run: |
          cp build_log.txt ci-last-build.log 2>/dev/null || true
          git config user.name "coco-ci"
          git config user.email "coco-ci@users.noreply.github.com"
          git add -f ci-last-build.log
          git commit -m "ci: capture build log [skip ci]" || true
          git push
