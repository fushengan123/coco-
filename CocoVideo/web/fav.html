<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>收藏 - COCO影视</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="back-head"><span class="back" onclick="location.href='index.html'">‹</span><h1>我的收藏</h1></div>
<div class="rank-tabs">
  <a class="on" data-k="fav">收藏</a>
  <a data-k="his">观影历史</a>
</div>
<div class="section" style="margin-top:10px;">
  <div class="vod-grid" id="grid"></div>
  <div class="empty-tip" id="empty" style="display:none;">暂无内容</div>
</div>
<div class="tabbar">
  <a href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a class="on" href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>
<script src="js/app.js"></script>
<script>
var curK = 'fav';
function render() {
  var data = curK === 'fav' ? Coco.getFavs() : Coco.getHistory();
  var el = document.getElementById('grid'), empty = document.getElementById('empty');
  if (!data.length) { el.innerHTML = ''; empty.style.display = 'block'; empty.textContent = curK === 'fav' ? '还没有收藏，去看看吧' : '还没有观看记录'; return; }
  empty.style.display = 'none';
  el.innerHTML = data.map(function (v) {
    return '<a class="poster" href="detail.html?id=' + v.id + '">' +
      '<div class="p-img"><img src="' + Coco.pic(v.pic) + '">' +
      (v.score && parseFloat(v.score) > 0 ? '<span class="p-score">' + v.score + '分</span>' : '') +
      (v.remark ? '<span class="p-remark">' + v.remark + '</span>' : '') +
      '</div><div class="p-name">' + v.name + '</div></a>';
  }).join('');
}
document.querySelectorAll('.rank-tabs a').forEach(function (a) {
  a.onclick = function () {
    document.querySelectorAll('.rank-tabs a').forEach(function (x) { x.classList.remove('on'); });
    a.classList.add('on'); curK = a.dataset.k; render();
  };
});
render();
</script>
</body>
</html>
