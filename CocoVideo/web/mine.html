<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的 - 开心视频</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 顶部横幅 -->
<div class="mine-banner">
  <div class="mine-avatar" id="avatarBox">🎬</div>
  <div style="flex:1;min-width:0;">
    <div class="mine-login-name" id="loginName">开心视频影迷</div>
    <div class="mine-login-sub" id="loginSub">点击登录网站会员</div>
    <div class="mine-vip" id="vipBar" style="display:none;margin-top:6px;">
      <span class="vip-tag" id="vipTag">会员</span>
    </div>
  </div>
  <div class="mine-login-btn" id="loginBtn" style="flex-shrink:0;">登录</div>
</div>

<!-- 功能图标 -->
<div class="mine-tools">
  <a class="mt-item" href="fav.html"><span class="mt-ico">⭐</span>我的收藏</a>
  <a class="mt-item" href="fav.html"><span class="mt-ico">🕘</span>观影历史</a>
  <a class="mt-item" href="rank.html"><span class="mt-ico">🏆</span>影视榜单</a>
  <a class="mt-item" id="shareApp"><span class="mt-ico">↗️</span>分享APP</a>
  <a class="mt-item" id="castHelp"><span class="mt-ico">📺</span>投屏帮助</a>
</div>

<!-- 会员功能列表 -->
<div class="mine-list" id="memberList">
  <a class="mine-row" id="mLogin"><span class="mr-ico">🔑</span>会员登录 / 注册<span class="mr-arrow">›</span></a>
  <a class="mine-row" id="mFind"><span class="mr-ico">🔐</span>找回密码<span class="mr-arrow">›</span></a>
</div>

<!-- 其他 -->
<div class="mine-list">
  <a class="mine-row" id="switchLine"><span class="mr-ico">🔀</span>切换线路<span class="mr-arrow" id="lineName">›</span></a>
  <a class="mine-row" id="feedback"><span class="mr-ico">💬</span>反馈 / 求片<span class="mr-arrow">›</span></a>
  <a class="mine-row" id="clearCache"><span class="mr-ico">🧹</span>清除缓存<span class="mr-arrow">›</span></a>
  <a class="mine-row" id="about"><span class="mr-ico">ℹ️</span>关于我们<span class="mr-arrow">›</span></a>
</div>

<div style="text-align:center;color:var(--txt3);font-size:12px;margin-top:24px;">开心视频 v1.7.0</div>

<div class="tabbar">
  <a href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a class="on" href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>
<script src="js/app.js"></script>
<script>
function renderUser() {
  var u = Coco.getUser();
  var name = document.getElementById('loginName');
  var sub = document.getElementById('loginSub');
  var vip = document.getElementById('vipBar');
  var btn = document.getElementById('loginBtn');
  var ml = document.getElementById('memberList');
  if (u) {
    name.textContent = u.name;
    sub.textContent = '已登录 · 会员功能已开启';
    btn.style.display = 'none';
    vip.style.display = 'none';
    // 仅真正会员（等级非"普通会员/游客"）才显示会员标签
    Coco.memberInfo(function (e2, d2) {
      var g = d2 && d2.group ? d2.group : '';
      var isVip = g && g != '普通会员' && g != '游客' && g != '游客组' && g.indexOf('未') < 0;
      if (isVip) vip.style.display = 'flex';
    });
    ml.innerHTML =
      '<a class="mine-row" href="member.html"><span class="mr-ico">👑</span>会员中心<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" href="profile.html"><span class="mr-ico">📝</span>个人资料<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" href="pwd.html"><span class="mr-ico">🔒</span>修改密码<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" href="card.html"><span class="mr-ico">🎫</span>激活码兑换<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" href="exchange.html"><span class="mr-ico">💎</span>积分兑换会员<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" href="recharge.html"><span class="mr-ico">💰</span>充值记录<span class="mr-arrow">›</span></a>' +
      '<a class="mine-row" id="mLogout"><span class="mr-ico">🚪</span>退出登录<span class="mr-arrow">›</span></a>';
    document.getElementById('mLogout').onclick = function () {
      Coco.logout(function () { Coco.toast('已退出登录'); renderUser(); });
    };
  } else {
    name.textContent = Coco.brand + '影迷';
    sub.textContent = '点击登录网站会员';
    vip.style.display = 'none';
    btn.style.display = 'block';
    ml.innerHTML =
      '<a class="mine-row" href="findpass.html"><span class="mr-ico">🔐</span>找回密码<span class="mr-arrow">›</span></a>';
  }
}
document.getElementById('loginBtn').onclick = function () { location.href = 'login.html'; };
document.getElementById('loginName').onclick = function () {
  var u = Coco.getUser();
  if (u) location.href = 'member.html'; else location.href = 'login.html';
};
document.getElementById('loginSub').onclick = function () {
  var u = Coco.getUser();
  if (u) location.href = 'member.html'; else location.href = 'login.html';
};
document.getElementById('feedback').onclick = function () { location.href = 'feedback.html'; };
document.getElementById('shareApp').onclick = function () { Native.share(Coco.brand); };
document.getElementById('castHelp').onclick = function () { Coco.toast('确保手机和电视连同一WiFi，播放页点电视投屏'); };
// 线路切换：两台站点轮换
(function bindSwitch() {
  var row = document.getElementById('switchLine');
  var label = document.getElementById('lineName');
  // 固定站点的包不显示切换入口（两个 App 各绑一站）
  if (Coco.fixedSite) { if (row) row.style.display = 'none'; return; }
  var cur = Coco.currentSite();
  var idx = Math.max(0, Coco.siteList.indexOf(cur));
  if (label) label.textContent = Coco.siteNames[idx] + ' ›';
  row.onclick = function () {
    var next = Coco.siteList[(idx + 1) % Coco.siteList.length];
    Coco.toast('切换到 ' + Coco.siteNames[(idx + 1) % Coco.siteList.length]);
    setTimeout(function () { Coco.switchSite(next); }, 300);
  };
})();

document.getElementById('clearCache').onclick = function () {
  localStorage.removeItem('coco_classes');
  Coco.toast('缓存已清除');
};
document.getElementById('about').onclick = function () {
  Coco.toast(Coco.brand + ' v1.7.0\n数据来源：' + SITE);
};
renderUser();
</script>
</body>
</html>
