<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="COCO影视">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>COCO影视</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- 顶部：logo+搜索 -->
<div class="topbar">
  <div class="logo"><span class="lg-ico">▶</span>COCO</div>
  <div class="search-box" onclick="location.href='search.html'">
    <input placeholder="搜索影片、演员、导演" readonly>
    <span class="s-ico">🔍</span>
  </div>
</div>

<!-- 一级分类横滑 -->
<div class="cat-tabs" id="catTabs">
  <a class="on" href="javascript:;">推荐</a>
</div>

<!-- 站内横幅位（正规轮播，无第三方广告） -->
<div class="banner-slot" id="bannerWrap">
  <div class="banner-track" id="bannerTrack"><div class="loading" style="line-height:130px;">加载中...</div></div>
  <div class="banner-dots" id="bannerDots"></div>
</div>
<div class="section">
  <div class="section-head"><h2>每日推荐</h2><a class="more" href="rank.html">更多 ›</a></div>
  <div class="hscroll" id="dailyList"><div class="loading">加载中...</div></div>
</div>

<!-- 实时推荐 -->
<div class="section">
  <div class="section-head"><h2>实时热门</h2><a class="more" href="rank.html">更多 ›</a></div>
  <div class="hscroll mini" id="hotList"><div class="loading">加载中...</div></div>
</div>

<!-- 最近更新 -->
<div class="section">
  <div class="section-head"><h2>最近更新</h2><a class="more" href="category.html">更多 ›</a></div>
  <div class="vod-grid" id="newList"></div>
  <div class="load-more" id="newMore" onclick="loadMore()">点击加载更多</div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <a class="on" href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>

<script src="js/app.js"></script>
<script>
var page = 1, loading = false, hasMore = true;

// 渲染一级分类
Coco.loadClasses(function (cls) {
  cls = cls || [];
  // 有的后台不返回 type_pid，过滤后会是空数组 → 退化成直接用整个列表
  var tops = cls.filter(function (c) { return c.type_pid == 0; });
  if (!tops.length) tops = cls;
  var tabs = document.getElementById('catTabs');
  tops.slice(0, 10).forEach(function (c) {
    var a = document.createElement('a');
    a.href = 'category.html?t=' + c.type_id;
    a.textContent = c.type_name;
    tabs.appendChild(a);
  });
});

function renderScroll(el, list, cls) {
  if (!list || !list.length) { el.innerHTML = '<div class="empty-tip">暂无数据</div>'; return; }
  el.innerHTML = list.map(Coco.poster).join('');
  Coco.imgLazy(el);
}

// 每日推荐
Coco.list('', 1, function (err, d) {
  var el = document.getElementById('dailyList');
  if (err) { el.innerHTML = '<div class="empty-tip">加载失败，下拉重试</div>'; return; }
  renderScroll(el, (d.list || []).slice(0, 12));
  loadBanner((d.list || []).slice(0, 5));
});
// 首页幻灯片轮播：取最新5部的幻灯片图/封面
function loadBanner(items) {
  if (!items || !items.length) return;
  var ids = items.map(function (v) { return v.vod_id; }).join(',');
  Coco.detail(ids, function (e2, d2) {
    if (e2 || !d2 || !d2.list || !d2.list.length) return;
    var list = d2.list;
    var track = document.getElementById('bannerTrack');
    var dots = document.getElementById('bannerDots');
    var html = '';
    list.forEach(function (v, i) {
      var pic = v.vod_pic_slide || v.vod_pic || '';
      if (!pic) return;
      html += '<a class="banner-slide" href="detail.html?id=' + v.vod_id + '">' +
        '<img src="' + Coco.pic(pic) + '" alt="">' +
        '<span class="banner-title">' + (v.vod_name || '') + '</span></a>';
    });
    var slides = list.filter(function (v) { return (v.vod_pic_slide || v.vod_pic); });
    if (!slides.length) { track.innerHTML = '<div class="loading" style="line-height:130px;">🎬 精彩影视 · 每日更新</div>'; return; }
    track.innerHTML = html;
    dots.innerHTML = slides.map(function (_, i) { return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('');
    var n = slides.length, idx = 0;
    var dd = dots.children;
    var go = function (i) {
      idx = (i + n) % n;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
      for (var k = 0; k < dd.length; k++) dd[k].className = k === idx ? 'on' : '';
    };
    for (var k = 0; k < dd.length; k++) (function (k) { dd[k].onclick = function () { go(k); resetTimer(); }; })(k);
    var timer = setInterval(function () { go(idx + 1); }, 3800);
    function resetTimer() { clearInterval(timer); timer = setInterval(function () { go(idx + 1); }, 3800); }
    var wrap = document.getElementById('bannerWrap');
    if (wrap) {
      wrap.addEventListener('touchstart', function () { clearInterval(timer); }, { passive: true });
      wrap.addEventListener('touchend', function () { resetTimer(); }, { passive: true });
    }
  });
}
// 实时热门（取第2页错开内容）
Coco.list('', 2, function (err, d) {
  var el = document.getElementById('hotList');
  if (err) { el.innerHTML = ''; return; }
  renderScroll(el, (d.list || []).slice(0, 12));
});
// 最近更新网格
function loadNew(reset) {
  loading = true;
  Coco.list('', page, function (err, d) {
    loading = false;
    var el = document.getElementById('newList');
    if (err) { document.getElementById('newMore').textContent = '加载失败，点击重试'; return; }
    var list = d.list || [];
    if (reset) el.innerHTML = '';
    el.innerHTML += list.map(Coco.poster).join('');
    Coco.imgLazy(el);
    hasMore = page < (d.pagecount || 1);
    document.getElementById('newMore').textContent = hasMore ? '上滑加载更多' : '已经到底啦';
  });
}
function loadMore() { if (loading || !hasMore) return; page++; loadNew(false); }
loadNew(true);
// 滚动到底部自动加载（节流）
Coco.scrollLoad(function () { loadMore(); });
</script>
<script>if('serviceWorker' in navigator && (location.protocol==='http:'||location.protocol==='https:')){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
