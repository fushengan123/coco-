<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>充值记录</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page-top">
  <span class="pt-back" onclick="history.back()">‹</span>
  <span class="pt-title">充值记录</span>
</div>

<div id="orderList"><div class="empty-tip">加载中...</div></div>

<div class="tabbar">
  <a href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a class="on" href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  if (!Coco.isLogin()) { location.href = 'login.html'; return; }
  Coco.orders(function (err, list) {
    var el = document.getElementById('orderList');
    if (err) { el.innerHTML = '<div class="empty-tip">加载失败，请稍后重试</div>'; return; }
    if (!list || !list.length) { el.innerHTML = '<div class="empty-tip">暂无充值记录</div>'; return; }
    el.innerHTML = list.map(function (o) {
      var paid = o.status.indexOf('已支付') > -1;
      return '<div class="order-item">' +
        '<div class="oi-top"><span class="oi-code">' + (o.code || ('订单' + o.id)) + '</span>' +
        '<span class="oi-status ' + (paid ? 'paid' : 'unpaid') + '">' + o.status + '</span></div>' +
        '<div class="oi-rows"><span>' + (o.time || '') + '</span><span class="oi-price">¥' + (o.price || '0') + '</span></div>' +
        (o.points ? '<div class="oi-rows" style="margin-top:6px;"><span>到账积分</span><span>' + o.points + '</span></div>' : '') +
        '</div>';
    }).join('');
  });
})();
</script>
</body>
</html>
