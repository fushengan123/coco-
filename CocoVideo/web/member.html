<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>会员中心</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page-top">
  <span class="pt-back" onclick="history.back()">‹</span>
  <span class="pt-title">会员中心</span>
</div>

<div class="member-card" id="memberCard">
  <div class="mc-top">
    <div class="mc-avatar">👤</div>
    <div>
      <div class="mc-name" id="mcName">加载中...</div>
      <div class="mc-sub" id="mcGroup">会员等级</div>
      <span class="level-badge" id="mcBadge">VIP</span>
    </div>
  </div>
  <div class="mc-stats">
    <div class="mc-stat"><div class="v" id="mcPoints">-</div><div class="l">当前积分</div></div>
    <div class="mc-stat"><div class="v" id="mcEnd">-</div><div class="l">到期时间</div></div>
    <div class="mc-stat"><div class="v" id="mcNum">-</div><div class="l">登录次数</div></div>
  </div>
</div>

<div class="menu-list">
  <a class="menu-row" href="profile.html">
    <span class="mr-ico" style="background:rgba(245,158,11,.15);">👤</span>
    <span class="mr-name">个人资料</span><span class="mr-arrow">›</span>
  </a>
  <a class="menu-row" href="recharge.html">
    <span class="mr-ico" style="background:rgba(96,165,250,.15);">💳</span>
    <span class="mr-name">充值记录</span><span class="mr-arrow">›</span>
  </a>
  <a class="menu-row" href="javascript:;" id="mLogout">
    <span class="mr-ico" style="background:rgba(248,113,113,.15);">🚪</span>
    <span class="mr-name">退出登录</span><span class="mr-arrow">›</span>
  </a>
</div>

<div class="tabbar">
  <a href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a class="on" href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>

<script src="js/app.js"></script>
<script>
(function () {
  var u = Coco.getUser();
  if (!u) { location.href = 'login.html'; return; }
  // 拿基本信息
  Coco.memberInfo(function (err, info) {
    if (err || !info || !info.name) return;
    document.getElementById('mcName').textContent = info.name || u.name;
    document.getElementById('mcGroup').textContent = '会员等级：' + (info.group || '普通会员');
    document.getElementById('mcPoints').textContent = info.points || '0';
    document.getElementById('mcNum').textContent = info.loginNum || '0';
    if (info.lastLogin) document.getElementById('mcGroup').textContent = '上次登录：' + info.lastLogin;
  });
  // 拿到期时间
  Coco.upgradeData(function (err2, d) {
    if (!err2 && d && d.endTime) document.getElementById('mcEnd').textContent = d.endTime;
  });
  document.getElementById('mLogout').onclick = function () {
    Coco.logout(function () { location.href = 'mine.html'; });
  };
})();
</script>
</body>
</html>
