<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>修改密码</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page-top">
  <span class="pt-back" onclick="history.back()">‹</span>
  <span class="pt-title">修改密码</span>
</div>

<div class="form-card">
  <div class="form-row"><label>原始密码</label><input id="old_pwd" type="password" placeholder="请输入当前密码"></div>
  <div class="form-row"><label>新密码</label><input id="new_pwd" type="password" placeholder="至少6位"></div>
  <div class="form-row"><label>确认密码</label><input id="new_pwd2" type="password" placeholder="再次输入新密码"></div>
</div>
<button class="btn-primary" id="btnSave">保存修改</button>
<div class="form-tip" id="tip">不记得密码请使用"找回密码"功能重置。</div>

<div class="tabbar">
  <a href="index.html"><span class="t-ico">🏠</span>首页</a>
  <a href="category.html"><span class="t-ico">🔲</span>分类</a>
  <a href="rank.html"><span class="t-ico">🔥</span>榜单</a>
  <a href="fav.html"><span class="t-ico">⭐</span>收藏</a>
  <a href="mine.html"><span class="t-ico">👤</span>我的</a>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('btnSave').onclick = function () {
  var btn = this;
  var o = document.getElementById('old_pwd').value;
  var p1 = document.getElementById('new_pwd').value;
  var p2 = document.getElementById('new_pwd2').value;
  var tip = document.getElementById('tip');
  if (!o) { tip.textContent = '请输入原始密码'; return; }
  if (!p1) { tip.textContent = '请输入新密码'; return; }
  if (p1.length < 6) { tip.textContent = '新密码至少6位'; return; }
  if (p1 != p2) { tip.textContent = '两次新密码不一致'; return; }
  if (!Coco.isLogin()) { tip.textContent = '请先登录'; setTimeout(function () { location.href = 'login.html'; }, 600); return; }
  btn.disabled = true; btn.textContent = '提交中...';
  Coco.post('/index.php/user/info', { user_pwd: o, user_pwd1: p1, user_pwd2: p2 }, function (err, d) {
    btn.disabled = false; btn.textContent = '保存修改';
    if (!err && d && d.code == 1) {
      tip.textContent = '✅ 密码修改成功';
      Coco.toast('修改成功');
      setTimeout(function () { location.href = 'mine.html'; }, 1500);
    } else {
      var msg = (d && d.msg) ? d.msg : '修改失败，请检查原密码是否正确';
      tip.textContent = msg;
      Coco.toast(msg);
    }
  });
};
</script>
</body>
</html>
